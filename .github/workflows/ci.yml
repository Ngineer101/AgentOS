name: ci
on: [push, pull_request]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y bubblewrap socat ripgrep
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build
        run: cargo build --all-targets
      - name: Install pinned sandbox runtime and adapters
        run: ./target/debug/agenthostd --data-dir "$RUNNER_TEMP/ah" install-tools
      - name: Test (including the sandbox escape suite)
        env:
          AGENTHOST_TEST_TOOLS: ${{ runner.temp }}/ah/tools
        run: cargo test --workspace --no-fail-fast -- --test-threads 4

  relay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries Rune links against
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y pkg-config libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Test the desktop app (Rune)
        working-directory: desktop
        run: cargo test
