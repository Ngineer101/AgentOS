[package]
name = "agenthost-host"
description = "The agenthost daemon: sessions, sandboxes, event log, MCP gateway and relay connector"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agenthost_host"
path = "src/lib.rs"

[[bin]]
name = "agenthostd"
path = "src/main.rs"

[dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
agenthost-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rusqlite.workspace = true
futures = "0.3"
async-trait = "0.1"
toml = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
libc = "0.2"
hound = "3.5"
tar = "0.4"
bzip2 = "0.6"
# Local speech-to-text for voice input (statically linked ONNX Runtime).
sherpa-onnx = { version = "=2.0.1", optional = true }

[features]
default = ["voice"]
voice = ["dep:sherpa-onnx"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
agenthost-cli = { path = "../cli" }
tempfile.workspace = true
rusqlite.workspace = true
