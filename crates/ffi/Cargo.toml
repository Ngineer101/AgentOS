[package]
name = "agenthost-ffi"
description = "UniFFI bindings for the iOS app: pairing, the relay tunnel and the client protocol, reusing agenthost-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agenthost_ffi"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

# `cargo run -p agenthost-ffi --features bindgen --bin uniffi-bindgen-swift -- …`
# (see ios/build-rust.sh). Not built by default so the library stays lean.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
agenthost-cli = { path = "../cli" }
agenthost-proto.workspace = true
anyhow.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi = "=0.32.2"

[dev-dependencies]
agenthost-host = { path = "../host" }
tempfile.workspace = true
