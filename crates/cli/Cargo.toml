[package]
name = "agenthost-cli"
description = "Command-line client for the AgentOS daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agenthost_cli"
path = "src/lib.rs"

[[bin]]
name = "agenthost"
path = "src/main.rs"

[dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite enables no rustls crypto backend; pick ring explicitly
# (it cross-compiles for iOS without cmake, unlike aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
base64.workspace = true
hex.workspace = true
agenthost-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
uuid.workspace = true
qrcode = { version = "0.14", default-features = false }
