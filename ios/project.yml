# XcodeGen project for the AgentHost iOS app.
#   1. ./build-rust.sh        (Rust staticlib -> Frameworks/AgentHostFFI.xcframework,
#                              regenerates Generated/agenthost_ffi.swift)
#   2. xcodegen generate      (writes AgentHost.xcodeproj; not committed)
#   3. open AgentHost.xcodeproj
name: AgentHost
options:
  bundleIdPrefix: dev.agenthost
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AgentHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AgentHost
      - path: Generated/agenthost_ffi.swift
    dependencies:
      # Static library + C header + module map (module `agenthost_ffiFFI`),
      # built by build-rust.sh. Static, so it is linked, not embedded.
      - framework: Frameworks/AgentHostFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework
    info:
      path: AgentHost/Info.plist
      properties:
        CFBundleDisplayName: AgentHost
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: AgentHost uses the camera to scan the pairing QR code shown on your computer.
        NSFaceIDUsageDescription: AgentHost asks for Face ID before showing your sessions and releasing this device's key.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agenthost.ios
        PRODUCT_NAME: AgentHost
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your team here or in Xcode (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
        DEAD_CODE_STRIPPING: true
