# The desktop app lives in its own workspace: Rune is a large GPU UI stack and
# needs crates.io patches of its own, which the host and CLI should not carry.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "agenthost-desktop"
description = "Desktop app for AgentOS, built with Rune"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "agenthost-desktop"
path = "src/main.rs"

[dependencies]
agenthost-proto = { path = "../crates/proto" }
agenthost-cli = { path = "../crates/cli" }
# Rune is pre-release: pin a rev of `dev` (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d", features = ["markdown"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false }
# Decodes the embedded logo PNG.
png = "0.17"
# Connector icons arrive as data: URLs.
base64 = "0.22"
# The terminal panel's emulator (screen state, scrollback, selection); the host owns the shell.
alacritty_terminal = "0.26"
# Microphone capture for voice input.
cpal = "0.16"

[dev-dependencies]
agenthost-host = { path = "../crates/host" }
tempfile = "3"
# The host's test MCP server (crates/host/tests/common/mcp_server.rs), for approvals.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Rune's own patches, which apps that build Rune apply too (see Rune's Cargo.toml).
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
naga = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
winit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
