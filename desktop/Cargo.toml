# The desktop app lives in its own workspace: Rune is a large GPU UI stack and
# needs crates.io patches of its own, which the host and CLI should not carry.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "agenthost-desktop"
description = "Desktop app for agenthost, built with Rune"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "agenthost-desktop"
path = "src/main.rs"

[dependencies]
agenthost-proto = { path = "../crates/proto" }
agenthost-cli = { path = "../crates/cli" }
# Rune is pre-release: pin a rev of `dev` (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "e7f3ad9fba336e9c33a5f25bb96e1c3aa7e2771b", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "e7f3ad9fba336e9c33a5f25bb96e1c3aa7e2771b", features = ["markdown"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false }
# Decodes the embedded logo PNG.
png = "0.17"
# Microphone capture for voice input.
cpal = "0.16"

[dev-dependencies]
agenthost-host = { path = "../crates/host" }
tempfile = "3"

# Rune's own patches, which apps that build Rune apply too (see Rune's Cargo.toml).
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "e7f3ad9fba336e9c33a5f25bb96e1c3aa7e2771b" }
winit = { git = "https://github.com/anomalyco/rune", rev = "e7f3ad9fba336e9c33a5f25bb96e1c3aa7e2771b" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "e7f3ad9fba336e9c33a5f25bb96e1c3aa7e2771b" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "e7f3ad9fba336e9c33a5f25bb96e1c3aa7e2771b" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "e7f3ad9fba336e9c33a5f25bb96e1c3aa7e2771b" }
